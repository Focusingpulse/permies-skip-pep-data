# ANDROID APK — build an installable debug APK in CI
#
# Why CI: the Village is a static site wrapped by Capacitor. Building the APK
# needs a JDK + Android SDK, which the agent sandbox does not have. GitHub's
# runners do. So the phone-testable artifact is produced here, not locally.
#
# The android/ project is gitignored and generated fresh on every run
# (`npx cap add android`) — the site at the repo root is the source of truth.
# www/ is likewise a build output, assembled by scripts/assemble-www.mjs.
# Neither is committed, so neither can go stale.
#
# To get the APK: Actions -> "Android APK" -> the run -> Artifacts ->
# village-debug-apk. Unzip, sideload app-debug.apk on the phone.
#
# NOTE (2026-10-02): we do NOT use android-actions/setup-android. Its default
# package list includes `tools`, which Google removed from the SDK repository,
# so it dies with "Failed to find package 'tools'". The ubuntu runner already
# ships the SDK; we just accept licenses and install the exact packages the
# project pins (compileSdk 36 / build-tools 36.0.0, from variables.gradle).

name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - 'crystal-skull/**'
      - 'money-lab/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # AGP 8.x requires JDK 17+; Capacitor 8 ships AGP 8.13, so 21 is the
      # safe choice.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          echo "ANDROID_HOME=$SDK"
          echo "sdkmanager=$SM"
          test -n "$SM" || { echo "::error::no sdkmanager found under $SDK"; exit 1; }
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      # www/ must exist before `cap add` — the CLI validates webDir.
      - name: Assemble web assets
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          echo "sdk.dir=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: village-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
